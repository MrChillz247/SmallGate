header{background:linear-gradient(135deg,#0b1b4d,#10286b 60%,#17368a);color:#fff;padding:0 16px;flex:none;height:72px;display:flex;align-items:center;z-index:5}
header h1{margin:0;font-size:21px;letter-spacing:.2px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{flex:none;display:block}
header h1 span{color:#5b9bff}
header small{opacity:.9}
main{padding:14px;max-width:760px;margin:0 auto}
nav{flex:none;height:48px;display:flex;background:#fff;border-top:1px solid var(--bd);box-shadow:0 -4px 16px rgba(30,58,138,.12);z-index:5}
nav button{flex:1;height:100%;padding:0 4px;border:0;background:none;font-size:14px;color:var(--mu);font-weight:600}
nav button.on{color:var(--g);border-top:3px solid var(--g)}
input,select,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #93b4ff;border-color:var(--g)}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
label{font-size:13px;font-weight:600;color:var(--mu)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--g);color:#fff;font-size:16px;font-weight:700;text-align:center;text-decoration:none}
.btn:active{background:var(--gd)}
.btn:disabled{opacity:.6}
.btn.alt{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0 6px 6px 0}
.btn.red{background:var(--rd)}
.btn.wa{background:#16a34a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:rgba(255,255,255,.94);border:1px solid rgba(219,227,243,.9);border-radius:14px;overflow:hidden;box-shadow:0 6px 18px rgba(30,58,138,.14)}
.card:active{transform:scale(.98)}
.card img,.noimg{width:100%;height:130px;object-fit:cover;display:block;background:#e6ecfa}
.noimg{display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px}
.cb{padding:8px 10px 10px}
.cb b{display:block;font-size:14px;line-height:1.25;margin:2px 0 4px;word-break:break-word}
.cb small{display:block}
.price{color:var(--g);font-weight:800}
.muted{color:var(--mu)}
.panel{background:rgba(255,255,255,.94);border:1px solid rgba(219,227,243,.9);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(30,58,138,.12)}
.hero{background:linear-gradient(135deg,rgba(227,235,255,.95),rgba(255,255,255,.95));border:1px solid rgba(219,227,243,.9);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(30,58,138,.12)}
.hero h2{margin:0 0 6px;font-size:19px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.msg{padding:10px 12px;border-radius:10px;margin:0 0 12px;font-size:14px}
.msg.err{background:#fdecea;color:var(--rd)}
.msg.ok{background:#e3ebff;color:var(--gd)}
.toast{position:fixed;left:12px;right:12px;bottom:84px;background:#111a33;color:#fff;padding:12px;border-radius:10px;z-index:30;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(10,20,50,.6);z-index:20;overflow:auto;padding:16px}
.sheet{background:#fff;border-radius:16px;max-width:560px;margin:0 auto;padding:14px}
.sheet img{width:100%;border-radius:10px;margin-bottom:8px}
.link{background:none;border:0;color:var(--g);font-weight:700;font-size:14px;padding:6px 0}
.tag{display:inline-block;background:#e3ebff;color:var(--gd);font-size:12px;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin:2px 0 6px}
.chip{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:#fff;font-size:14px;font-weight:600;color:var(--mu)}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:table;text-align:center;font-size:12px;color:var(--gd);font-weight:700;margin:18px auto 4px;padding:6px 14px;background:rgba(255,255,255,.92);border-radius:20px}
h3{display:inline-block;margin:14px 0 10px;padding:7px 14px;background:rgba(255,255,255,.95);color:#0b1b4d;border-radius:12px;box-shadow:0 4px 12px rgba(30,58,138,.14);font-size:16px}
p.muted{background:rgba(255,255,255,.95);padding:10px 12px;border-radius:10px}
.grid>p.muted{grid-column:1/-1}
.panel p.muted,.hero p.muted,.sheet p.muted{background:none;padding:0}
.panel>h3{display:block;background:none;box-shadow:none;padding:0;margin:0 0 10px;color:#0b1b4d}
.panel .panel{background:#f2f6ff;box-shadow:none}
</style>
</head>
<body>

<script>
// ===== Settings (these two values are safe to be public) =====
const SUPABASE_URL = 'https://rpgfstweeyabtmdarwug.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lRyZBA0CDf9E-eJGQRdQoQ_9SS_tRFu';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// Your WhatsApp number for seller verification, e.g. '2348012345678'. Leave '' to hide the button.
const SUPPORT_WHATSAPP = '2349025891073';

const STATES = ['Abia','Adamawa','Akwa Ibom','Anambra','Bauchi','Bayelsa','Benue','Borno','Cross River','Delta','Ebonyi','Edo','Ekiti','Enugu','FCT Abuja','Gombe','Imo','Jigawa','Kaduna','Kano','Katsina','Kebbi','Kogi','Kwara','Lagos','Nasarawa','Niger','Ogun','Ondo','Osun','Oyo','Plateau','Rivers','Sokoto','Taraba','Yobe','Zamfara'];
const LCOLS = 'id,title,description,price,photos,category_id,seller_id,condition,state,area,negotiable,created_at';

// ===== Helpers (everything is added as plain text, never as raw HTML) =====
const $ = s => document.querySelector(s);
function h(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const naira = v => '₦' + Number(v).toLocaleString('en-NG');
const PHOTO_PREFIX = SUPABASE_URL + '/storage/v1/object/public/listing-photos/';
const safeUrl = u => (typeof u === 'string' && u.startsWith(PHOTO_PREFIX)) ? u : null;
function toast(t) { const d = h('div', { class: 'toast' }, t); document.body.append(d); setTimeout(() => d.remove(), 3500); }
function msg(kind, text) { return h('div', { class: 'msg ' + kind }, text); }
const strongPw = p => p.length >= 10 && /[a-z]/.test(p) && /[A-Z]/.test(p) && /[0-9]/.test(p) && /[^A-Za-z0-9]/.test(p);
function normPhone(p) { let n = String(p).replace(/\D/g, ''); if (n.startsWith('0')) n = '234' + n.slice(1); return n; }
const isHttp = () => location.protocol.startsWith('http');
const shopLink = slug => (isHttp() ? location.origin : '') + location.pathname + '#/shop/' + slug;
const slugify = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
function clearHash() { if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} } }
async function shareLink(url, title) {
  if (!isHttp()) { toast('Your shop link will work once SmallGate is online.'); return; }
  try {
    if (navigator.share) { await navigator.share({ title, url }); return; }
    await navigator.clipboard.writeText(url); toast('Link copied. Paste it on WhatsApp!');
  } catch (e) {}
}
const waLink = (num, text) => 'https://wa.me/' + String(num).replace(/\D/g, '') + '?text=' + encodeURIComponent(text);

// ===== State =====
let user = null, profile = null, myShop = null, cats = [], tab = 'browse', authMode = 'login', editShop = false;
let filter = { cat: '', q: '', state: '' };

async function loadProfile() {
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  profile = data || null;
  myShop = null;
  if (profile && (profile.role === 'seller' || profile.role === 'admin')) {
    const s = await sb.from('shops').select('*').eq('id', user.id).maybeSingle();
    myShop = s.data || null;
  }
}

async function init() {
  const { data } = await sb.auth.getSession();
  user = data.session ? data.session.user : null;
  if (user) await loadProfile();
  const c = await sb.from('categories').select('*').order('id');
  cats = c.data || [];
  render();
  window.addEventListener('hashchange', render);
  sb.auth.onAuthStateChange((ev, sess) => {
    setTimeout(async () => {
      if (ev !== 'SIGNED_IN' && ev !== 'SIGNED_OUT') return;
      const newId = sess && sess.user ? sess.user.id : null;
      const oldId = user ? user.id : null;
      user = sess ? sess.user : null;
      if (newId === oldId && profile) return;
      profile = null; myShop = null;
      if (user) await loadProfile();
      render();
    }, 0);
  });
}

// ===== Layout =====
function render() {
  const main = $('#main');
  main.replaceChildren();
  const m = location.hash.match(/^#\/shop\/([a-z0-9-]{3,40})$/);
  if (m) main.append(shopView(m[1]));
  else if (tab === 'browse') main.append(browseView());
  else if (tab === 'sell') main.append(user ? sellView() : authView('Log in to open your shop'));
  else if (tab === 'admin') main.append(adminView());
  else main.append(user ? accountView() : authView());
  main.append(h('div', { class: 'foot' }, 'SmallGate · Buy & sell anything'));
  const items = [['browse', 'Browse'], ['sell', 'Sell']];
  if (profile && profile.role === 'admin') items.push(['admin', 'Admin']);
  items.push(['account', user ? 'Account' : 'Log in']);
  $('#nav').replaceChildren(...items.map(([k, label]) =>
    h('button', { class: (!m && tab === k) ? 'on' : '', onclick: () => { clearHash(); tab = k; render(); $('#scroll').scrollTop = 0; } }, label)));
}

// ===== Seller info + cards =====
async function sellersFor(ids) {
  const map = {};
  if (!ids.length) return map;
  const [p, s] = await Promise.all([
    sb.from('public_profiles').select('id,full_name,verified').in('id', ids),
    sb.from('shops').select('id,shop_name,slug,whatsapp,state,area,bio').in('id', ids)
  ]);
  (p.data || []).forEach(x => map[x.id] = { name: x.full_name, verified: x.verified, shop: null });
  (s.data || []).forEach(x => {
    if (!map[x.id]) map[x.id] = { name: x.shop_name, verified: false, shop: null };
    map[x.id].shop = x; map[x.id].name = x.shop_name;
  });
  return map;
}
const noSeller = { name: 'Seller', verified: false, shop: null };

function listingCard(l, s) {
  const img = safeUrl(l.photos && l.photos[0]);
  return h('div', { class: 'card', onclick: () => openDetail(l, s) },
    img ? h('img', { src: img, alt: '', loading: 'lazy' }) : h('div', { class: 'noimg' }, 'No photo'),
    h('div', { class: 'cb' },
      h('div', { class: 'price' }, naira(l.price)),
      h('b', {}, l.title),
      h('small', { class: 'muted' }, [l.condition === 'used' ? 'Used' : 'New', l.area || l.state].filter(Boolean).join(' · ')),
      h('small', { class: 'muted' }, s.name + (s.verified ? ' ✔' : ''))));
}

// ===== Browse =====
function browseView() {
  const box = h('div');
  if (!user) {
    box.append(h('div', { class: 'hero' },
      h('h2', {}, 'Open your free shop in minutes'),
      h('p', { class: 'muted', style: 'margin:0 0 10px' }, 'List what you sell, get your own shop link, and let buyers order on WhatsApp.'),
      h('button', { class: 'btn', onclick: () => { authMode = 'signup'; tab = 'account'; render(); } }, 'Start selling free')));
  }
  const q = h('input', { type: 'search', placeholder: 'Search items…', maxlength: '60', value: filter.q });
  const st = h('select', {}, h('option', { value: '' }, 'All Nigeria'), ...STATES.map(s => h('option', { value: s }, s)));
  st.value = filter.state;
  const grid = h('div', { class: 'grid' });
  const chipEls = [];
  const mkChip = (v, label) => {
    const b = h('button', { class: 'chip' + (filter.cat === v ? ' on' : '') }, label);
    b.addEventListener('click', () => { filter.cat = v; chipEls.forEach(x => x.b.classList.toggle('on', x.v === v)); load(); });
    chipEls.push({ b, v }); return b;
  };
  const chips = h('div', { class: 'chips' }, mkChip('', 'All'), ...cats.map(c => mkChip(String(c.id), c.name)));

  async function load() {
    grid.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
    let qb = sb.from('listings').select(LCOLS).eq('status', 'active').order('created_at', { ascending: false }).limit(40);
    if (filter.cat) qb = qb.eq('category_id', Number(filter.cat));
    if (filter.state) qb = qb.eq('state', filter.state);
    if (filter.q) qb = qb.ilike('title', '%' + filter.q.replace(/[%_,()\\]/g, ' ') + '%');
    const { data, error } = await qb;
    grid.replaceChildren();
    if (error) { grid.append(msg('err', 'Could not load items. Check your connection.')); return; }
    if (!data.length) { grid.append(h('p', { class: 'muted' }, 'Nothing here yet. Try another search, or be the first to list something!')); return; }
    const sellers = await sellersFor([...new Set(data.map(x => x.seller_id))]);
    data.forEach(l => grid.append(listingCard(l, sellers[l.seller_id] || noSeller)));
  }
  let t;
  q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { filter.q = q.value.trim(); load(); }, 350); });
  st.addEventListener('change', () => { filter.state = st.value; load(); });
  box.append(h('div', { class: 'two' }, q, st), chips, grid);
  load();
  return box;
}

function openDetail(l, s) {
  const photos = (l.photos || []).map(safeUrl).filter(Boolean);
  const cat = cats.find(c => c.id === l.category_id);

function authView(title) {
  const box = h('div', { class: 'panel' });
  const err = h('div');
  const name = h('input', { type: 'text', placeholder: 'Full name', maxlength: '80', autocomplete: 'name' });
  const email = h('input', { type: 'email', placeholder: 'Email', autocomplete: 'email' });
  const pw = h('input', { type: 'password', placeholder: 'Password', autocomplete: authMode === 'login' ? 'current-password' : 'new-password' });
  const hint = h('small', { class: 'muted' }, 'Password: at least 10 characters with a capital letter, small letter, number and symbol.');
  const btn = h('button', { class: 'btn' }, authMode === 'login' ? 'Log in' : 'Create account');

  btn.addEventListener('click', async () => {
    err.replaceChildren();
    const em = email.value.trim(), p = pw.value, nm = name.value.trim();
    if (!em || !p) { err.append(msg('err', 'Enter your email and password.')); return; }
    btn.disabled = true;
    if (authMode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email: em, password: p });
      btn.disabled = false;
      if (error) { err.append(msg('err', 'Wrong email or password, or you have not confirmed your email yet.')); return; }
      tab = 'browse';
    } else {
      if (nm.length < 2) { err.append(msg('err', 'Enter your full name.')); btn.disabled = false; return; }
      if (!strongPw(p)) { err.append(msg('err', 'Password is too weak. Follow the rule below the box.')); btn.disabled = false; return; }
      const redirect = isHttp() ? location.origin + location.pathname : undefined;
      const { error } = await sb.auth.signUp({ email: em, password: p, options: { data: { full_name: nm }, emailRedirectTo: redirect } });
      btn.disabled = false;
      if (error) { err.append(msg('err', 'Could not create the account: ' + error.message)); return; }
      err.append(msg('ok', 'Almost done! We sent a confirmation link to your email. Open it, then come back here and log in.'));
      authMode = 'login';
    }
  });

  const swap = h('button', { class: 'link', onclick: () => { authMode = authMode === 'login' ? 'signup' : 'login'; render(); } },
    authMode === 'login' ? 'New here? Create an account' : 'Already have an account? Log in');

  box.append(h('h2', { style: 'margin-top:0' }, title || (authMode === 'login' ? 'Log in' : 'Create your account')), err);
  if (authMode === 'signup') box.append(h('label', {}, 'Full name'), name);
  box.append(h('label', {}, 'Email'), email, h('label', {}, 'Password'), pw);
  if (authMode === 'signup') box.append(hint, h('div', { style: 'height:12px' }));
  box.append(btn, swap);
  return box;
}

async function compress(file) {
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) throw new Error('Only JPG, PNG or WebP photos are allowed.');
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  if (!blob || blob.size > 2 * 1024 * 1024) throw new Error('A photo is too large. Try a smaller one.');
  return blob;
}

function listingForm(onDone) {
  const err = h('div');
  const title = h('input', { type: 'text', placeholder: 'What are you selling?', maxlength: '100' });
  const cat = h('select', {}, ...cats.map(c => h('option', { value: String(c.id) }, c.name)));
  const cond = h('select', {}, h('option', { value: 'new' }, 'Brand new'), h('option', { value: 'used' }, 'Used'));
  const price = h('input', { type: 'number', placeholder: 'Price in ₦', min: '1', inputmode: 'numeric' });
  const neg = h('input', { type: 'checkbox' });
  const desc = h('textarea', { rows: '4', placeholder: 'Describe it (size, condition, delivery or pickup…)', maxlength: '2000' });
  const photos = h('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp', multiple: 'multiple' });
  const btn = h('button', { class: 'btn' }, 'Post listing');

  btn.addEventListener('click', async () => {
    err.replaceChildren();
    const t = title.value.trim(), pr = Number(price.value), d = desc.value.trim();
    if (t.length < 3) { err.append(msg('err', 'Give your item a title (at least 3 letters).')); return; }
    if (!(pr > 0) || pr > 10000000) { err.append(msg('err', 'Enter a valid price.')); return; }
    if (photos.files.length < 1) { err.append(msg('err', 'Add at least one photo. Items with photos sell much faster.')); return; }
    if (photos.files.length > 5) { err.append(msg('err', 'Maximum of 5 photos.')); return; }
    if (!profile.verified && profile.role === 'seller') {
      const c = await sb.from('listings').select('id', { count: 'exact', head: true }).eq('seller_id', user.id).eq('status', 'active');
      if ((c.count || 0) >= 3) { err.append(msg('err', 'New sellers can have 3 active items until verified. Mark one as sold or get verified to add more.')); return; }
    }
    btn.disabled = true; btn.textContent = 'Uploading…';
    try {
      const urls = [];
      for (const f of photos.files) {
        const blob = await compress(f);
        const path = user.id + '/' + crypto.randomUUID() + '.jpg';
        const up = await sb.storage.from('listing-photos').upload(path, blob, { contentType: 'image/jpeg' });
        if (up.error) throw new Error('Photo upload failed. Try again.');
        urls.push(sb.storage.from('listing-photos').getPublicUrl(path).data.publicUrl);
      }
      const { error } = await sb.from('listings').insert({
        seller_id: user.id, category_id: Number(cat.value), title: t, description: d || null, price: pr, photos: urls,
        condition: cond.value, negotiable: neg.checked, state: myShop.state || null, area: myShop.area || null });
      if (error) throw new Error(String(error.message || '').includes('Unverified')
        ? 'New sellers can have 3 active items until verified.' : 'Could not post your listing. Try again.');
      title.value = ''; price.value = ''; desc.value = ''; photos.value = ''; neg.checked = false;
      err.append(msg('ok', 'Your listing is live!'));
      onDone();
    } catch (e) {
      err.append(msg('err', e.message || 'Something went wrong.'));
    }
    btn.disabled = false; btn.textContent = 'Post listing';
  });

  return h('div', { class: 'panel' }, h('h2', { style: 'margin-top:0' }, 'New listing'), err,
    h('label', {}, 'Title'), title, h('label', {}, 'Category'), cat, h('label', {}, 'Condition'), cond,
    h('label', {}, 'Price (₦)'), price,
    h('label', { style: 'display:block;margin-bottom:12px' }, neg, 'Price is negotiable'),
    h('label', {}, 'Description'), desc, h('label', {}, 'Photos (1 to 5)'), photos, btn);
}

function adminView() {

  const reqs = h('div'), vers = h('div'), reps = h('div'), lst = h('div');
  const sec = (t, el) => h('div', { class: 'panel' }, h('h3', {}, t), el);
  const box = h('div', {}, sec('Sellers waiting for verification', reqs), sec('Open reports', reps),
    sec('Verified sellers', vers), sec('Active listings', lst));

  async function loadReqs() {
    reqs.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
    const { data, error } = await sb.from('profiles').select('id,full_name,phone,hostel')
      .eq('seller_requested', true).eq('role', 'buyer');
    reqs.replaceChildren();
    if (error) { reqs.append(msg('err', 'Could not load requests.')); return; }
    if (!data.length) { reqs.append(h('p', { class: 'muted' }, 'No pending requests.')); return; }
    data.forEach(p => reqs.append(h('div', { class: 'panel' },
      h('b', {}, p.full_name),
      h('div', { class: 'muted' }, (p.phone || 'no phone') + (p.hostel ? ' · ' + p.hostel : '')),
      h('div', { style: 'margin-top:8px' },
        h('button', { class: 'btn sm', onclick: () => decide(p.id, true) }, 'Approve'),
        h('button', { class: 'btn sm red', onclick: () => decide(p.id, false) }, 'Reject')))));
  }
  async function decide(id, ok) {
    const { error } = await sb.rpc('admin_set_seller', { target: id, approve: ok });
    toast(error ? 'Failed: ' + error.message : (ok ? 'Seller approved' : 'Request rejected'));
    loadSellers();
  }
  async function removeListing(id) {
    if (!confirm('Remove this listing?')) return;
    const { error } = await sb.rpc('admin_remove_listing', { target: id });
    toast(error ? 'Failed: ' + error.message : 'Listing removed');
    loadReps(); loadList();
  }
  async function loadReps() {
    reps.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
    const { data, error } = await sb.from('reports').select('id,listing_id,reason')
      .eq('status', 'open').order('created_at', { ascending: false });
    reps.replaceChildren();
    if (error) { reps.append(msg('err', 'Could not load reports.')); return; }
    if (!data.length) { reps.append(h('p', { class: 'muted' }, 'No open reports.')); return; }
    const ids = [...new Set(data.map(r => r.listing_id).filter(Boolean))];
    const titles = {};
    if (ids.length) {
      const l = await sb.from('listings').select('id,title').in('id', ids);
      (l.data || []).forEach(x => titles[x.id] = x.title);
    }
    data.forEach(r => reps.append(h('div', { class: 'panel' },
      h('b', {}, titles[r.listing_id] || '(listing no longer available)'),
      h('p', {}, r.reason),
      h('div', {},
        r.listing_id ? h('button', { class: 'btn sm red', onclick: () => removeListing(r.listing_id) }, 'Remove listing') : null,
        h('button', { class: 'btn sm alt', onclick: async () => {
          const { error } = await sb.rpc('admin_close_report', { target: r.id });
          toast(error ? 'Failed: ' + error.message : 'Report dismissed');
          loadReps();
        } }, 'Dismiss')))));
  }
  function requestCard(p) {
    return h('div', { class: 'panel' },
      h('div', { class: 'row' }, h('b', {}, p.full_name), h('span', { class: 'tag' }, 'Requested')),
      h('div', { class: 'muted' }, (p.phone || 'no phone') + (p.hostel ? ' · ' + p.hostel : '')),
      h('div', { style: 'margin-top:8px' },
        p.phone ? h('a', { class: 'btn sm wa', target: '_blank', rel: 'noopener',
          href: waLink(normPhone(p.phone), 'Hi, this is SmallGate. We are verifying your seller account.') }, 'WhatsApp') : null,
        h('button', { class: 'btn sm', onclick: () => decide(p.id, true) }, 'Approve ✔'),
        h('button', { class: 'btn sm red', onclick: () => decide(p.id, false) }, 'Reject')));
  }
  async function loadSellers() {
    reqs.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
    vers.replaceChildren();
    const { data, error } = await sb.from('profiles').select('id,full_name,phone,hostel,verified')
      .eq('role', 'seller').order('created_at', { ascending: false }).limit(100);
    reqs.replaceChildren();
    if (error) { reqs.append(msg('err', 'Could not load sellers.')); return; }
    const oldQ = await sb.from('profiles').select('id,full_name,phone,hostel')
      .eq('seller_requested', true).eq('role', 'buyer');
    const oldReqs = oldQ.data || [];
    const ids = data.map(p => p.id);
    const shops = {}, counts = {};
    if (ids.length) {
      const [s, l] = await Promise.all([
        sb.from('shops').select('id,shop_name,slug').in('id', ids),
        sb.from('listings').select('seller_id').in('seller_id', ids).eq('status', 'active')]);
      (s.data || []).forEach(x => shops[x.id] = x);
      (l.data || []).forEach(x => counts[x.seller_id] = (counts[x.seller_id] || 0) + 1);
    }
    const pending = data.filter(p => !p.verified), done = data.filter(p => p.verified);
    oldReqs.forEach(p => reqs.append(requestCard(p)));
    if (!pending.length && !oldReqs.length) reqs.append(h('p', { class: 'muted' }, 'Nobody is waiting for verification.'));
    pending.forEach(p => reqs.append(sellerCard(p, shops[p.id], counts[p.id] || 0, false)));
    if (!done.length) vers.append(h('p', { class: 'muted' }, 'No verified sellers yet.'));
    done.forEach(p => vers.append(sellerCard(p, shops[p.id], counts[p.id] || 0, true)));
  }
  function sellerCard(p, shop, n, isVerified) {
    return h('div', { class: 'panel' },
      h('div', { class: 'row' }, h('b', {}, p.full_name), isVerified ? h('span', { class: 'tag' }, 'Verified ✔') : null),
      h('div', { class: 'muted' }, (p.phone || 'no phone') + (p.hostel ? ' · ' + p.hostel : '')),
      h('div', { class: 'muted' }, (shop ? 'Shop: ' + shop.shop_name : 'No shop yet') + ' · ' + n + ' active item(s)'),
      h('div', { style: 'margin-top:8px' },
        shop ? h('button', { class: 'btn sm alt', onclick: () => { location.hash = '#/shop/' + shop.slug; } }, 'View shop') : null,
        p.phone ? h('a', { class: 'btn sm wa', target: '_blank', rel: 'noopener',
          href: waLink(normPhone(p.phone), 'Hi, this is SmallGate. We are verifying your seller account.') }, 'WhatsApp') : null,
        !isVerified ? h('button', { class: 'btn sm', onclick: () => verifySeller(p.id) }, 'Verify ✔') : null,
        h('button', { class: 'btn sm red', onclick: () => suspendSeller(p.id) }, 'Suspend')));
  }
  async function verifySeller(id) {
    const { error } = await sb.rpc('admin_verify_seller', { target: id, verify: true });
    toast(error ? 'Failed: ' + error.message : 'Seller verified ✔');
    loadSellers();
  }
  async function suspendSeller(id) {
    if (!confirm('Suspend this seller and remove all their active listings?')) return;
    const { error } = await sb.rpc('admin_suspend_seller', { target: id });
    toast(error ? 'Failed: ' + error.message : 'Seller suspended');
    loadSellers(); loadList();
  }
  async function loadList() {
    lst.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
    const { data, error } = await sb.from('listings').select('id,title,price').eq('status', 'active')
      .order('created_at', { ascending: false }).limit(50);
    lst.replaceChildren();
    if (error) { lst.append(msg('err', 'Could not load listings.')); return; }
    if (!data.length) { lst.append(h('p', { class: 'muted' }, 'No active listings.')); return; }
    data.forEach(l => lst.append(h('div', { class: 'panel' },
      h('div', { class: 'row' }, h('b', {}, l.title), h('span', { class: 'price' }, naira(l.price))),
      h('div', { style: 'margin-top:8px' },
        h('button', { class: 'btn sm red', onclick: () => removeListing(l.id) }, 'Remove')))));
  }
  loadSellers(); loadReps(); loadList();
  return box;
}

init();
</script>
</body>
</html>
